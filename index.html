<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 가계부">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141925" media="(prefers-color-scheme: dark)">
<title>우리집 가계부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F7FC; --card:#FFFFFF; --ink:#22315A; --muted:#7A86A3; --line:#E4EAF4; --soft:#EEF2FA;
  --c-p1:#FF8FA3; --c-p2:#5FAEF7; --c-both:#A98BF5; --c-save:#2FBF95; --c-loan:#4058AC; --c-etc:#F5B83D; --c-none:#D3DAE7;
  --warn:#E5534B; --good:#1F9F7A;
  --shadow:0 1px 0 rgba(34,49,90,.04), 0 8px 20px -12px rgba(34,49,90,.28);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --cute:'Jua','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141925; --card:#1C2333; --ink:#E8EDF7; --muted:#97A2BC; --line:#2A3347; --soft:#252D40;
  --c-p1:#FF9DB0; --c-p2:#79BCFA; --c-both:#B8A0FA; --c-save:#4AD1AA; --c-loan:#8EA2EE; --c-etc:#F7C55E; --c-none:#3A445A;
  --warn:#FF7A72; --good:#4AD1AA; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--c-p2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.warn{color:var(--warn)}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
.top{display:flex;align-items:center;gap:4px;padding:6px 0 12px}
.month{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.month h1{font-family:var(--cute);font-weight:400;font-size:24px;margin:0 2px;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
.icon-btn:active{background:var(--soft)}
.today-btn{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:600;margin-left:4px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.card-h h2{font-family:var(--cute);font-weight:400;font-size:19px;margin:0}
.card-h .side{font-size:13px;color:var(--muted)}
.link{color:var(--c-p2);font-weight:700;font-size:14px;padding:6px 2px}
.empty{text-align:center;color:var(--muted);padding:16px 8px;font-size:14px;margin:0}
.empty b{display:block;font-size:34px;font-weight:400;margin-bottom:4px}

.hero{padding:22px 20px 20px}
.hero-k{margin:0;font-size:14px;font-weight:600}
.hero-k span{font-weight:400}
.hero-n{margin:2px 0 4px;font-family:var(--cute);font-size:40px;line-height:1.15}
.hero-sub{margin:0 0 14px;font-size:14px}
.hero-sub b{color:var(--c-save)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.stack i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.list > .row + .row{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 2px}
.ico{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px;flex:none}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--muted);font-size:12.5px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--c-etc) 28%,transparent);color:var(--ink);margin-left:6px;font-weight:600}

.env-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.env{position:relative;overflow:hidden;border-radius:18px;background:var(--soft);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;min-height:136px;isolation:isolate}
.env::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);background:color-mix(in srgb,var(--c) 32%,transparent);z-index:-1;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.env-emo{font-size:32px;line-height:1}
.env-name{margin-top:8px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env-amt{font-family:var(--cute);font-size:21px;margin-top:auto}
.env-goal{font-size:11.5px;color:var(--muted)}
.env.full .env-goal{color:var(--good);font-weight:700}
.env.add{align-items:center;justify-content:center;color:var(--muted);border:2px dashed var(--line);background:none;font-size:13px;font-weight:600;gap:2px}
.env.add b{font-size:26px;font-weight:400;line-height:1}
.coin{position:absolute;left:50%;top:-34px;font-size:28px;pointer-events:none;z-index:2;animation:drop .85s cubic-bezier(.45,0,.8,.3) forwards}
@keyframes drop{0%{transform:translate(-50%,0) rotate(0)}75%{transform:translate(-50%,118px) rotate(220deg);opacity:1}100%{transform:translate(-50%,128px) scale(.3);opacity:0}}
.bump{animation:bump .5s ease .45s}
@keyframes bump{40%{transform:scale(1.045)}}

.loan{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.loan + .loan{border-top:1px solid var(--line)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:2px;color:transparent;transition:background .2s,border-color .2s}
.check svg{width:16px;height:16px}
.check:disabled{opacity:.4}
.loan.paid .check{background:var(--c-save);border-color:var(--c-save);color:#fff}
.loan.just .check{animation:pop .4s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.loan-body{flex:1;text-align:left;min-width:0}
.loan-top{display:flex;justify-content:space-between;gap:8px}
.loan-top b:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loan.paid .loan-top b:first-child{color:var(--muted);text-decoration:line-through}
.loan-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin:2px 0 7px}
.loan-meta b{color:var(--ink)}
.pbar{display:block;height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c-loan);border-radius:99px;transition:width .6s}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--soft);margin:12px 0 0}
.note.bad{background:color-mix(in srgb,var(--warn) 13%,transparent)}
.sum-line{margin:-4px 0 4px;font-size:13.5px;color:var(--muted)}
.sum-line b{color:var(--ink)}

.who-tabs{margin-bottom:14px}
.wallet{display:flex;gap:14px;align-items:center}
.wallet-emo{font-size:40px;line-height:1;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 24%,transparent);flex:none}
.wallet-n{font-family:var(--cute);font-size:30px;line-height:1.2}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.day{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 2px 2px;display:flex;justify-content:space-between}
.day:first-child{margin-top:0}

.diag-hero{display:flex;gap:16px;align-items:center}
.mascot{font-size:56px;line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.diag-title{font-family:var(--cute);font-size:22px;margin:2px 0}
.donut-wrap{display:flex;gap:14px;align-items:center}
.donut{width:140px;height:140px;flex:none}
.d-c{font-family:var(--cute);font-size:22px;fill:var(--ink)}
.d-s{font-size:10px;fill:var(--muted)}
.dl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dl div{display:flex;align-items:center;gap:6px}
.dl span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:14px;line-height:1.55}
.tip-e{font-size:22px;line-height:1.2;flex:none}
.bar-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.bar-row .bar{height:12px}
.cols{display:flex;align-items:flex-end;gap:8px;height:160px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.colv{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:10px 10px 4px 4px;overflow:hidden;min-height:4px;background:var(--soft)}
.col small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.col .v{font-size:10.5px;color:var(--muted)}
.col.cur small{color:var(--ink);font-weight:700}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:12px;color:var(--muted);font-weight:600}
.nav button span{font-size:22px;line-height:1.15;filter:grayscale(1);opacity:.55;transition:.2s}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button[aria-selected="true"] span{filter:none;opacity:1}

.sheet{position:fixed;inset:0;z-index:40;pointer-events:none}
.sheet-back{position:absolute;inset:0;background:rgba(12,18,32,.42);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:90%;overflow:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open{pointer-events:auto}
.sheet.open .sheet-back{opacity:1}
.sheet.open .sheet-panel{transform:none}
.sheet:not(.open) .sheet-panel{visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--cute);font-weight:400;font-size:23px;margin:0 0 4px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}

.field{display:block;margin-top:16px}
.field > span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--c-p2)}
.emo-in{width:72px;text-align:center;font-size:24px;padding:8px}
.amt-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px}
.amt-in:focus-within{border-color:var(--c-p2)}
.amt-in input{flex:1;border:0;outline:0;background:none;font-family:var(--cute);font-size:32px;min-width:0;padding:0}
.amt-in input::placeholder{color:var(--line)}
.amt-in em{font-style:normal;color:var(--muted);font-size:18px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{padding:7px 12px;border-radius:99px;background:var(--soft);font-size:13.5px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;padding:9px 4px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15.5px}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.ghost{background:var(--soft)}
.btn.danger{color:var(--warn)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;margin-top:22px}
.actions .btn.primary{flex:1}
.emo-pick{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px}
.emo-pick button{width:38px;height:38px;border-radius:10px;font-size:21px}
.emo-pick button:active{background:var(--soft)}
.wipe-month{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0 2px}
.wipe-month b{font-family:var(--cute);font-size:21px;font-weight:400;min-width:120px;text-align:center}
.wipe-row{cursor:pointer}
.wipe-row input{width:22px;height:22px;accent-color:var(--warn);flex:none;margin:0}
.btn.danger-fill{background:var(--warn);color:#fff;flex:1}
.x{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:15px;flex:none}
.x:active{background:var(--soft)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,16px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;width:max-content;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--warn);color:#fff}

.setup{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.setup-card{width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:30px 22px;box-shadow:var(--shadow)}
.setup-card .big{font-size:60px;text-align:center;margin:0;line-height:1}
.setup-card h1{font-family:var(--cute);font-weight:400;text-align:center;margin:10px 0 4px;font-size:30px}
.setup-card > p{text-align:center;margin:0}
.err{color:var(--warn);font-size:13.5px;min-height:1.3em;margin:12px 0 0}

@media (max-width:360px){.hero-n{font-size:34px}.env-amt{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="setup" class="setup" hidden>
  <div class="setup-card">
    <p class="big">🐷</p>
    <h1>우리집 가계부</h1>
    <p class="muted">구글 시트에 연결하면 두 사람이 같은 기록을 함께 봐요</p>
    <label class="field"><span>서버 주소 (Apps Script 웹 앱 URL)</span><input class="input" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>비밀번호</span><input class="input" id="sPin" type="password" autocomplete="current-password"></label>
    <p class="err" id="sErr"></p>
    <button class="btn primary wide" id="sGo">연결하기</button>
  </div>
</div>

<div id="app" hidden>
  <div class="app">
    <header class="top">
      <div class="month">
        <button class="icon-btn" data-act="prev" aria-label="이전 달">‹</button>
        <h1 id="mTitle"></h1>
        <button class="icon-btn" data-act="next" aria-label="다음 달">›</button>
        <button class="today-btn" id="todayBtn" data-act="today" hidden>이번 달</button>
      </div>
      <button class="icon-btn" data-act="sync" aria-label="새로고침"><span id="syncIco">↻</span></button>
      <button class="icon-btn" data-act="settings" aria-label="설정">⚙︎</button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="nav">
    <div class="nav-in" role="tablist">
      <button role="tab" data-act="tab" data-id="month"><span>🗓️</span>이번 달</button>
      <button role="tab" data-act="tab" data-id="ledger"><span>✏️</span>가계부 쓰기</button>
      <button role="tab" data-act="tab" data-id="diag"><span>🩺</span>저축 진단</button>
    </div>
  </nav>
</div>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-back" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ========== 기본 도우미 ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const curMonth = () => ymd(new Date()).slice(0, 7);
const num = v => Number(v) || 0;
const fmt = n => Math.round(num(n)).toLocaleString('ko-KR');
const won = n => fmt(n) + '원';
const short = n => { n = num(n); const a = Math.abs(n);
  if (a >= 1e8) return +(n / 1e8).toFixed(1) + '억';
  if (a >= 1e4) return +(n / 1e4).toFixed(a >= 1e6 ? 0 : 1) + '만';
  return fmt(n); };
const digits = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shiftMonth = (m, d) => { const [y, mo] = m.split('-').map(Number); const t = new Date(y, mo - 1 + d, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };
const mNum = m => Number(m.slice(5, 7));
const mLabel = m => `${m.slice(0, 4)}년 ${mNum(m)}월`;
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const dayLabel = s => { const [y, m, d] = String(s).split('-').map(Number); if (!d) return s; return `${m}월 ${d}일 ${'일월화수목금토'[new Date(y, m - 1, d).getDay()]}요일`; };
const fmtDT = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ========== 상수 ========== */
const TABLES = ['settings', 'incomes', 'incomeMonth', 'envs', 'deposits', 'loans', 'loanPays', 'ledger'];
const keyOf = t => (t === 'settings' || t === 'incomeMonth' || t === 'loanPays') ? 'key' : 'id';
const KINDS = { spend: { label: '생활비', emoji: '👛' }, save: { label: '저축', emoji: '🐷' }, loan: { label: '대출', emoji: '🏦' }, etc: { label: '기타', emoji: '📦' } };
const CATS = [['식비', '🍚'], ['카페·간식', '☕'], ['배달·외식', '🛵'], ['생활용품', '🧻'], ['교통', '🚌'], ['쇼핑', '🛍️'], ['의료·건강', '💊'], ['문화·여가', '🎬'], ['경조사·선물', '🎁'], ['미용', '💇'], ['기타', '📌']];
const CAT_E = Object.fromEntries(CATS);
const PEOPLE_EMO = ['🐰', '🐻', '🐱', '🐶', '🦊', '🐼', '🐥', '🐹', '🐨', '🐯', '🐸', '🐧'];
const ENV_EMO = ['👛', '🏠', '🐷', '🏦', '💰', '🎯', '🌱', '✈️', '🚗', '🎁', '🍼', '🐰', '🐻', '💍', '🩺', '📦'];
const LOAN_EMO = ['🏦', '🏠', '🚗', '🎓', '💳', '💍', '🏢', '📄'];
const PALETTE = ['var(--c-p1)', 'var(--c-p2)', 'var(--c-save)', 'var(--c-etc)', 'var(--c-both)', 'var(--c-loan)'];

/* ========== 상태 ========== */
const blank = () => Object.fromEntries(TABLES.map(t => [t, []]));
let D = Object.assign(blank(), LS.get('gb2_cache', {}));
let sheetUrl = LS.get('gb2_sheet', '');
let M = curMonth();
let tab = LS.get('gb2_tab', 'month');
let ledgerOwner = null, justPaid = null, lastSync = 0, pending = 0;
let queue = Promise.resolve();
const cfg = () => LS.get('gb2_cfg', null);
const me = () => LS.get('gb2_me', null);
const persist = () => LS.set('gb2_cache', D);
const setting = (k, d = '') => { const r = D.settings.find(s => s.key === k); return r && r.value !== '' ? r.value : d; };
function person(o) {
  if (o === 'p1') return { name: setting('name1', '아내'), emoji: setting('emoji1', '🐰'), c: 'var(--c-p1)' };
  if (o === 'p2') return { name: setting('name2', '남편'), emoji: setting('emoji2', '🐻'), c: 'var(--c-p2)' };
  return { name: '공용', emoji: '🏠', c: 'var(--c-both)' };
}
const envColor = e => e.kind === 'save' ? 'var(--c-save)' : e.kind === 'loan' ? 'var(--c-loan)' : e.kind === 'etc' ? 'var(--c-etc)' : person(e.owner).c;

/* ========== 계산 ========== */
const live = arr => arr.filter(r => r.active !== 'N');
const sum = (arr, f = 'amount') => arr.reduce((s, r) => s + num(r[f]), 0);
const incomes = () => live(D.incomes).sort((a, b) => num(a.payDay) - num(b.payDay));
const incomeOverride = (inc, m = M) => D.incomeMonth.find(r => r.key === m + '|' + inc.id);
const incomeAmt = (inc, m = M) => { const o = incomeOverride(inc, m); return o ? num(o.amount) : num(inc.amount); };
const incomeTotal = (m = M) => incomes().reduce((s, i) => s + incomeAmt(i, m), 0);
const envs = () => live(D.envs).sort((a, b) => num(a.sort) - num(b.sort));
const depOf = (m, envId) => D.deposits.filter(d => d.month === m && (!envId || d.envId === envId));
const envAmt = (e, m = M) => sum(depOf(m, e.id));
const kindAmt = (kind, m = M) => D.envs.filter(e => e.kind === kind).reduce((s, e) => s + envAmt(e, m), 0);
const allocated = (m = M) => sum(depOf(m));
const envFill = (e, m = M) => { const a = envAmt(e, m), t = num(e.target); return t ? Math.min(100, a / t * 100) : (a ? 55 : 0); };
const loans = () => live(D.loans).sort((a, b) => (num(a.payDay) || 99) - (num(b.payDay) || 99));
const payOf = (l, m = M) => D.loanPays.find(p => p.key === m + '|' + l.id);
const principalPaid = l => sum(D.loanPays.filter(p => p.loanId === l.id), 'principalPaid');
const remaining = l => Math.max(0, num(l.balance) - principalPaid(l));
const loanDue = () => loans().filter(l => remaining(l) > 0 || payOf(l));
const ledgerOf = (m, owner) => D.ledger.filter(l => String(l.date).slice(0, 7) === m && (!owner || l.owner === owner));
const allowance = (owner, m = M) => envs().filter(e => e.kind === 'spend' && e.owner === owner).reduce((s, e) => s + envAmt(e, m), 0);
const defaultDate = () => M === curMonth() ? ymd(new Date()) : `${M}-01`;

/* ========== 서버 ========== */
async function api(action, payload, c = cfg()) {
  if (!c) throw new Error('서버 연결이 필요해요');
  let res, j;
  try { res = await fetch(c.url, { method: 'POST', body: JSON.stringify({ action, payload, pin: c.pin }) }); }
  catch (e) { throw new Error('서버에 연결하지 못했어요. 인터넷 연결과 웹 앱 주소를 확인해 주세요'); }
  try { j = await res.json(); }
  catch (e) { throw new Error('서버 응답을 읽지 못했어요. 배포할 때 액세스를 "모든 사용자"로 했는지 확인해 주세요'); }
  if (!j.ok) throw new Error(j.error || '알 수 없는 오류가 났어요');
  return j.data;
}
const put = (t, row) => ({ op: 'put', t, row });
const del = (t, key) => ({ op: 'del', t, key });
function applyOps(ops) {
  ops.forEach(o => {
    const arr = D[o.t], k = keyOf(o.t);
    const target = o.op === 'put' ? o.row[k] : o.key;
    const i = arr.findIndex(r => String(r[k]) === String(target));
    if (o.op === 'put') { if (i >= 0) arr[i] = { ...arr[i], ...o.row }; else arr.push({ ...o.row }); }
    else if (i >= 0) arr.splice(i, 1);
  });
}
// 화면엔 바로 반영하고, 시트 저장은 순서대로 뒤에서 처리
function save(ops, okMsg) {
  applyOps(ops); persist(); render();
  if (okMsg) toast(okMsg);
  pending++; setSyncing(true);
  queue = queue.then(() => api('batch', { ops }))
    .catch(err => { toast('시트에 저장하지 못했어요. ' + err.message, true); pending = 0; return sync(); })
    .finally(() => { pending = Math.max(0, pending - 1); if (!pending) setSyncing(false); });
}
async function sync(manual) {
  if (pending) return;
  setSyncing(true);
  try {
    const d = await api('load', {});
    D = blank(); TABLES.forEach(t => D[t] = Array.isArray(d[t]) ? d[t] : []);
    sheetUrl = d.sheetUrl || ''; LS.set('gb2_sheet', sheetUrl);
    persist(); lastSync = Date.now();
    if (!setting('seeded')) seed(); else safeRender();
    if (!me()) pickMe();
    else if (manual) toast('최신 기록을 불러왔어요');
  } catch (e) { toast(e.message, true); }
  finally { if (!pending) setSyncing(false); }
}
function seed() {
  const now = new Date().toISOString();
  const env = (name, emoji, owner, kind, sort) => put('envs', { id: uid(), name, emoji, owner, kind, target: 0, sort, active: 'Y', createdAt: now });
  save([
    env('아내 생활비', '🐰', 'p1', 'spend', 1),
    env('남편 생활비', '🐻', 'p2', 'spend', 2),
    env('공용 생활비', '🏠', 'both', 'spend', 3),
    env('대출 통장', '🏦', 'both', 'loan', 4),
    env('저축 통장', '🐷', 'both', 'save', 5),
    put('incomes', { id: uid(), name: '아내 월급', owner: 'p1', amount: 0, payDay: 10, active: 'Y', createdAt: now }),
    put('incomes', { id: uid(), name: '남편 월급', owner: 'p2', amount: 0, payDay: 25, active: 'Y', createdAt: now }),
    put('settings', { key: 'seeded', value: '1' })
  ]);
}

/* ========== 화면 공통 ========== */
function setSyncing(on) { const i = $('#syncIco'); if (i) i.classList.toggle('spin', !!on); }
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), err ? 4200 : 2200);
}
function openSheet(html, mount) {
  $('#sheetBody').innerHTML = html;
  const s = $('#sheet'); s.classList.add('open'); s.setAttribute('aria-hidden', 'false');
  $('.sheet-panel').scrollTop = 0;
  if (mount) mount($('#sheetBody'));
}
function closeSheet() { const s = $('#sheet'); s.classList.remove('open'); s.setAttribute('aria-hidden', 'true'); }
function countUp(el, from, to) {
  if (!el || from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now(), dur = 700;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = won(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const pick = id => { const b = $('#' + id + ' .on'); return b ? b.dataset.v : null; };
const ownerSeg = (id, val, withBoth) => `<div class="seg" data-group id="${id}">${(withBoth ? ['p1', 'p2', 'both'] : ['p1', 'p2']).map(k => { const p = person(k); return `<button type="button" class="${k === val ? 'on' : ''}" data-v="${k}">${p.emoji} ${esc(p.name)}</button>`; }).join('')}</div>`;
const emoPick = (forId, list) => `<div class="emo-pick" data-for="${forId}">${list.map(e => `<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('')}</div>`;
const moneyField = (id, label, val, ph = '0') => `<label class="field"><span>${label}</span><div class="amt-in"><input id="${id}" inputmode="numeric" autocomplete="off" value="${num(val) ? fmt(val) : ''}" placeholder="${ph}"><em>원</em></div></label>`;
function safeRender() { const a = document.activeElement; if (a && $('#view').contains(a) && a.tagName === 'INPUT') return; render(); }

function render() {
  $('#mTitle').textContent = mLabel(M);
  $('#todayBtn').hidden = M === curMonth();

}

/* ========== 탭 1: 이번 달 ========== */
function viewMonth() {
  const inc = incomeTotal(), alloc = allocated(), left = inc - alloc, es = envs();
  const segs = es.map(e => ({ v: envAmt(e), c: envColor(e), n: e.name })).filter(s => s.v > 0);
  const base = Math.max(inc, alloc) || 1;
  let sub;
  if (!inc) sub = `<span class="muted">아래 수입에 이번 달 금액을 적어주세요</span>`;
  else if (left > 0) sub = `아직 안 나눈 돈 <b class="num">${won(left)}</b>`;
  else if (left < 0) sub = `<span class="warn">수입보다 ${won(-left)} 더 나눴어요</span>`;
  else sub = `한 푼도 빠짐없이 다 나눴어요 ✨`;

  const hero = `<section class="card hero">
    <p class="hero-k">${mNum(M)}월에 나눌 돈 <span class="muted">${mNum(shiftMonth(M, -1))}월 월급</span></p>
    <p class="hero-n num">${won(inc)}</p>
    <p class="hero-sub">${sub}</p>
    <div class="stack">${segs.map(s => `<i style="width:${s.v / base * 100}%;background:${s.c}"></i>`).join('')}</div>
    ${segs.length ? `<div class="legend">${segs.map(s => `<span><i class="dot" style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : ''}
  </section>`;

  const incs = incomes();
  const incHtml = `<section class="card"><div class="card-h"><h2>💰 수입</h2><button class="link" data-act="addIncome">+ 추가</button></div>
    <div class="list">${incs.length ? incs.map(i => {
      const p = person(i.owner), a = incomeAmt(i), o = incomeOverride(i), changed = o && num(o.amount) !== num(i.amount);
      return `<button class="row" data-act="income" data-id="${i.id}"><span class="ico">${p.emoji}</span>
        <span class="mid"><b>${esc(i.name)}</b><small>${num(i.payDay) ? `${mNum(shiftMonth(M, -1))}월 ${num(i.payDay)}일 입금` : '입금일 미정'}${changed ? '<em class="tag">이번 달 변동</em>' : ''}</small></span>
        <span class="amt">${a ? won(a) : '<span class="muted">금액 입력</span>'}</span></button>`;
    }).join('') : `<p class="empty">수입 항목을 추가해 주세요</p>`}</div></section>`;

  const envHtml = `<section class="card"><div class="card-h"><h2>👛 통장 나누기</h2><span class="side">통장을 눌러 돈을 넣어요</span></div>
    <div class="env-grid">${es.map(e => {
      const a = envAmt(e), t = num(e.target);
      return `<button class="env ${t && a >= t ? 'full' : ''}" data-act="env" data-id="${e.id}" style="--c:${envColor(e)};--fill:${envFill(e)}%">
        <span class="env-emo">${esc(e.emoji || KINDS[e.kind]?.emoji || '👛')}</span><span class="env-name">${esc(e.name)}</span>
        <span class="env-amt num" data-env-amt>${won(a)}</span>
        <span class="env-goal">${t ? (a >= t ? '목표 달성 🎉' : `목표까지 ${short(t - a)}원`) : (KINDS[e.kind]?.label || '')}</span></button>`;
    }).join('')}<button class="env add" data-act="addEnv"><b>＋</b>통장 추가</button></div></section>`;

  const ls = loans(), due = loanDue(), paidN = due.filter(l => payOf(l)).length;
  const monthTotal = sum(due, 'monthly'), remTotal = ls.reduce((s, l) => s + remaining(l), 0);
  const loanEnvIn = kindAmt('loan'), hasLoanEnv = es.some(e => e.kind === 'loan');
  let note = '';
  if (hasLoanEnv && monthTotal) note = loanEnvIn >= monthTotal
    ? `<p class="note">🏦 대출 통장에 ${won(loanEnvIn)} 넣어서 이번 달 대출금은 충분해요</p>`
    : `<p class="note bad">🏦 대출 통장에 ${won(monthTotal - loanEnvIn)} 더 넣어야 이번 달 대출금이 채워져요</p>`;
  const loanHtml = `<section class="card"><div class="card-h"><h2>🏦 이번 달 대출</h2><span class="side">${due.length ? `${due.length}건 중 ${paidN}건 냈어요` : ''}</span></div>
    ${ls.length ? `<p class="sum-line">이번 달 낼 돈 <b class="num">${won(monthTotal)}</b>, 남은 잔금 합계 <b class="num">${won(remTotal)}</b></p>` : ''}
    <div>${ls.map(loanRow).join('') || `<p class="empty"><b>🏦</b>대출을 추가하면 매달 냈는지 체크할 수 있어요</p>`}</div>
    <button class="btn ghost wide" style="margin-top:8px" data-act="addLoan">+ 대출 추가</button>${note}</section>`;

  return hero + incHtml + envHtml + loanHtml;
}
function loanRow(l) {
  const p = payOf(l), rem = remaining(l), bal = num(l.balance), done = rem <= 0 && !p;
  const pct = bal ? Math.min(100, (bal - rem) / bal * 100) : 0;
  const paidInfo = p && p.paidAt ? ` (${num(String(p.paidAt).slice(5, 7))}/${num(String(p.paidAt).slice(8, 10))} ${esc(person(p.paidBy).name)})` : '';
  return `<div class="loan ${p ? 'paid' : ''} ${justPaid === l.id ? 'just' : ''}">
    <button class="check" data-act="payLoan" data-id="${l.id}" aria-pressed="${!!p}" aria-label="${esc(l.name)} ${p ? '납부 체크 취소' : '냈어요'}" ${done ? 'disabled' : ''}>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>

}

}
function deposit(e, v) {
  const before = envAmt(e), oldFill = envFill(e);

  requestAnimationFrame(() => card.style.setProperty('--fill', newFill));

  card.appendChild(coin); setTimeout(() => coin.remove(), 900);

/* ========== 탭 3: 저축 진단 ========== */
function grade(inc, rate) {
  if (!inc) return { e: '🤔', t: '수입을 먼저 알려주세요' };
  if (rate >= 30) return { e: '🏆', t: '저축 우등생이에요!' };
  if (rate >= 20) return { e: '😊', t: '차곡차곡 잘 모으고 있어요' };
  if (rate >= 10) return { e: '🌱', t: '조금만 더 모아볼까요?' };
  if (rate > 0) return { e: '🐣', t: '저축 습관을 키우는 중이에요' };
  return { e: '🫙', t: '저축 통장이 아직 비어 있어요' };
}
function diagnose() {
  const tips = [], inc = incomeTotal(), left = inc - allocated(), saved = kindAmt('save');
  const rateIf = extra => Math.round((saved + extra) / inc * 100);
  if (!inc) return [{ e: '💰', t: '이번 달 탭에서 수입 금액을 적어주면 저축률을 계산해 드릴게요.' }];
  if (saved / inc >= 0.3) tips.push({ e: '🏆', t: `수입의 ${rateIf(0)}%를 저축했어요. 지금처럼만 가면 돼요!` });
  incomes().forEach(i => {
    const a = incomeAmt(i), b = num(i.amount);
    if (b && a < b * 0.9) tips.push({ e: '📉', t: `${esc(i.name)}이 평소보다 ${won(b - a)} 적게 들어왔어요. 이번 달은 공용 생활비를 조금 줄이고, 저축 금액은 그대로 지켜보는 건 어떨까요?` });
    else if (b && a > b * 1.1) tips.push({ e: '📈', t: `${esc(i.name)}이 평소보다 ${won(a - b)} 많아요! 늘어난 만큼 저축 통장에 넣으면 저축률이 ${rateIf(a - b)}%가 돼요.` });
  });
  if (left > 0) tips.push({ e: '🪙', t: `아직 안 나눈 돈이 ${won(left)} 있어요. 저축 통장에 넣으면 저축률이 ${rateIf(left)}%로 올라가요.` });
  if (left < 0) tips.push({ e: '⚠️', t: `나눈 돈이 수입보다 ${won(-left)} 많아요. 통장별 금액을 다시 확인해 보세요.` });
  const ls = loans(), due = sum(loanDue(), 'monthly'), loanIn = kindAmt('loan');
  if (due && envs().some(e => e.kind === 'loan') && loanIn < due) tips.push({ e: '🏦', t: `대출 통장에 ${won(due - loanIn)}이 모자라요. 대출금이 빠져나가기 전에 채워 두세요.` });
  if (M === curMonth()) {
    const today = new Date().getDate();
    const late = ls.filter(l => !payOf(l) && remaining(l) > 0 && num(l.payDay) && num(l.payDay) < today);
    if (late.length) tips.push({ e: '⏰', t: `${late.map(l => esc(l.name)).join(', ')} 납부일이 지났는데 아직 체크 전이에요. 빠져나갔는지 확인해 보세요.` });
  }
  const all = ledgerOf(M), total = sum(all);
  if (all.length) {
    const by = c => sum(all.filter(l => l.category === c));
    const cafe = by('카페·간식');
    if (cafe >= 30000) tips.push({ e: '☕', t: `이번 달 카페·간식에 ${won(cafe)} 썼어요. 다음 달은 커피를 집에서 내려 마셔서 ${short(Math.round(cafe * 0.6 / 1000) * 1000)}원 정도를 저축에 더해보는 건 어떨까요?` });
    const deli = by('배달·외식');
    if (total && deli / total >= 0.25) tips.push({ e: '🛵', t: `쓴 돈의 ${Math.round(deli / total * 100)}%가 배달·외식이에요. 네 번 중 한 번만 집밥으로 바꿔도 한 달에 ${short(Math.round(deli / 4 / 1000) * 1000)}원 정도 아낄 수 있어요.` });
    const shop = by('쇼핑');
    if (total && shop / total >= 0.3) tips.push({ e: '🛍️', t: `쇼핑이 쓴 돈의 ${Math.round(shop / total * 100)}%예요. 장바구니에 담고 하루 뒤에 결제하면 충동구매가 꽤 줄어요.` });
    ['p1', 'p2', 'both'].forEach(o => {
      const b = allowance(o), s = sum(ledgerOf(M, o)), p = person(o), who = o === 'both' ? '공용 생활비' : `${p.name} 생활비`;
      if (b && s > b) tips.push({ e: p.emoji, t: `${esc(who)}를 ${won(s - b)} 넘게 썼어요. 다음 달 금액을 다시 정하거나 지출을 조금 줄여봐요.` });
      else if (b && s && M === curMonth() && new Date().getDate() >= 20 && s <= b * 0.6) tips.push({ e: p.emoji, t: `${esc(who)}가 아직 ${won(b - s)} 남았어요. 월말에 남는 돈은 저축 통장으로 옮겨볼까요?` });
    });
    const prevT = sum(ledgerOf(shiftMonth(M, -1)));
    if (prevT && total > prevT * 1.2) tips.push({ e: '📊', t: `지난달보다 쓴 돈이 ${won(total - prevT)} 늘었어요.` });
    else if (prevT && M !== curMonth() && total < prevT * 0.8) tips.push({ e: '👏', t: `지난달보다 ${won(prevT - total)} 덜 썼어요. 잘했어요!` });
  } else tips.push({ e: '✏️', t: '가계부 쓰기 탭에 쓴 돈을 남기면 카페나 배달처럼 어디서 돈이 새는지도 알려드릴게요.' });
  const rem = ls.reduce((s, l) => s + remaining(l), 0);
  const perM = ls.filter(l => remaining(l) > 0).reduce((s, l) => s + (num(l.principal) || num(l.monthly)), 0);
  if (rem && perM) {
    const n = Math.ceil(rem / perM), y = Math.floor(n / 12), mo = n % 12;
    tips.push({ e: '🎯', t: `지금 속도면 약 ${y ? y + '년 ' : ''}${mo ? mo + '개월' : ''} 뒤, ${mLabel(shiftMonth(M, n))}쯤 대출을 다 갚아요. 남은 잔금은 ${won(rem)}이에요.` });
  }
  if (!saved && !left) tips.push({ e: '🐷', t: '이번 달은 저축 통장에 넣은 돈이 없어요. 적은 금액이라도 먼저 떼어 두면 습관이 돼요.' });
  return tips;
}
function donut(segs, center, sub) {
  const total = segs.reduce((s, x) => s + x.v, 0), R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcs = total ? segs.map(s => { const len = s.v / total * C; const a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke-width="20" style="stroke:${s.c}" stroke-dasharray="${Math.max(0.01, len - (segs.length > 1 ? 1.5 : 0))} ${C}" stroke-dashoffset="${-off}"/>`; off += len; return a; }).join('') : '';
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="월급이 나뉜 비율"><circle r="${R}" cx="70" cy="70" fill="none" stroke-width="20" style="stroke:var(--soft)"/><g transform="rotate(-90 70 70)">${arcs}</g><text x="70" y="72" text-anchor="middle" class="d-c">${center}</text><text x="70" y="90" text-anchor="middle" class="d-s">${sub}</text></svg>`;
}

  const loanCut = sum(D.loanPays.filter(p => p.month === M), 'principalPaid');
  const hero = `<section class="card"><div class="diag-hero"><span class="mascot" aria-hidden="true">${g.e}</span><div>
    <p class="muted" style="margin:0;font-size:13.5px">${mNum(M)}월 우리집 저축 진단</p><p class="diag-title">${g.t}</p>
    <p style="margin:0;font-size:14px">저축률 <b class="num">${rate}%</b>${loanCut ? `, 대출 원금 ${short(loanCut)}원 갚았어요` : ''}</p></div></div></section>`;

  const left = inc - allocated();
  const segs = envs().map(e => ({ v: envAmt(e), c: envColor(e), n: e.name })).filter(s => s.v > 0);
  if (left > 0) segs.push({ v: left, c: 'var(--c-none)', n: '안 나눈 돈' });
  const segT = segs.reduce((s, x) => s + x.v, 0);
  const donutHtml = `<section class="card"><div class="card-h"><h2>🍩 월급이 간 곳</h2></div>
    ${segT ? `<div class="donut-wrap">${donut(segs, rate + '%', '저축률')}<div class="dl">${segs.map(s => `<div><i class="dot" style="background:${s.c}"></i><span>${esc(s.n)}</span><b class="num">${Math.round(s.v / segT * 100)}%</b></div>`).join('')}</div></div>`
      : `<p class="empty"><b>🍩</b>통장에 돈을 나눠 넣으면 그래프가 그려져요</p>`}</section>`;

  const tipsHtml = `<section class="card"><div class="card-h"><h2>🩺 진단과 제안</h2></div><div class="tips">${diagnose().map(t => `<div class="tip"><span class="tip-e">${t.e}</span><span>${t.t}</span></div>`).join('')}</div></section>`;

  const all = ledgerOf(M);
  const cats = CATS.map(([c, e]) => ({ c, e, v: sum(all.filter(l => l.category === c)) })).filter(x => x.v).sort((a, b) => b.v - a.v);
  const cmax = cats.length ? cats[0].v : 1;
  const catHtml = cats.length ? `<section class="card"><div class="card-h"><h2>🧺 어디에 많이 썼을까</h2><span class="side">${won(sum(all))}</span></div>
    ${cats.map((x, i) => `<div class="bar-row"><span>${x.e} ${x.c}</span><div class="bar"><i style="width:${x.v / cmax * 100}%;background:${PALETTE[i % PALETTE.length]}"></i></div><b class="num">${short(x.v)}${x.v < 1e4 ? '원' : ''}</b></div>`).join('')}</section>` : '';

  const ms = [5, 4, 3, 2, 1, 0].map(i => shiftMonth(M, -i));
  const data = ms.map(m => ({ m, s: kindAmt('save', m), l: sum(D.loanPays.filter(p => p.month === m), 'principalPaid') }));
  const tmax = Math.max(1, ...data.map(d => d.s + d.l));
  const hasTrend = data.some(d => d.s + d.l);
  const trendHtml = `<section class="card"><div class="card-h"><h2>📈 모은 돈 흐름</h2><span class="side">최근 6개월</span></div>
    ${hasTrend ? `<div class="cols">${data.map(d => { const t = d.s + d.l; return `<div class="col ${d.m === M ? 'cur' : ''}"><span class="v num">${t ? short(t) : ''}</span>
      <div class="colv" style="height:${t / tmax * 110}px">${d.s ? `<i style="flex:${d.s};background:var(--c-save)"></i>` : ''}${d.l ? `<i style="flex:${d.l};background:var(--c-loan)"></i>` : ''}</div><small>${mNum(d.m)}월</small></div>`; }).join('')}</div>
      <div class="legend"><span><i class="dot" style="background:var(--c-save)"></i>저축</span><span><i class="dot" style="background:var(--c-loan)"></i>대출 원금 갚은 돈</span></div>`
      : `<p class="empty"><b>📈</b>저축 통장에 돈을 넣거나 대출을 체크하면 쌓여요</p>`}</section>`;
  return hero + donutHtml + tipsHtml + catHtml + trendHtml;
}

/* ========== 설정 ========== */
function openSettings() {
  openSheet(`<h2>설정</h2>
    ${['1', '2'].map(n => `<div class="field"><span>${n === '1' ? '첫 번째' : '두 번째'} 사람</span>
      <div style="display:flex;gap:8px"><input class="input emo-in" id="sE${n}" value="${esc(setting('emoji' + n, n === '1' ? '🐰' : '🐻'))}" aria-label="이모지"><input class="input" id="sN${n}" value="${esc(setting('name' + n, n === '1' ? '아내' : '남편'))}" aria-label="이름"></div>
      ${emoPick('sE' + n, PEOPLE_EMO)}</div>`).join('')}
    <div class="field"><span>이 폰은 누가 쓰나요?</span>${ownerSeg('sMe', me() || 'p1', false)}</div>
    <div class="actions"><button class="btn primary" id="sSave">저장</button></div>
    <div class="list" style="margin-top:20px">
      ${sheetUrl ? `<a class="row" href="${esc(sheetUrl)}" target="_blank" rel="noopener"><span class="ico">📗</span><span class="mid"><b>구글 시트에서 보기</b><small>모든 기록이 여기에 저장돼요</small></span></a>` : ''}
      <button class="row" id="sLink"><span class="ico">🔗</span><span class="mid"><b>배우자 폰 연결 링크 복사</b><small>링크를 열고 비밀번호만 넣으면 연결돼요</small></span></button>
      <button class="row" id="sWipe"><span class="ico">🧹</span><span class="mid"><b>월별 기록 지우기</b><small>한 달 기록을 골라서 한 번에 지워요</small></span></button>
      <button class="row" id="sOut"><span class="ico">🔌</span><span class="mid"><b>이 폰에서 연결 끊기</b><small>기록은 시트에 그대로 남아요</small></span></button>
    </div>`, () => {
    $('#sSave').onclick = () => {
      const ops = ['1', '2'].flatMap(n => [put('settings', { key: 'name' + n, value: $('#sN' + n).value.trim() }), put('settings', { key: 'emoji' + n, value: $('#sE' + n).value.trim() })]);
      LS.set('gb2_me', pick('sMe') || 'p1'); ledgerOwner = null;
      closeSheet(); save(ops, '설정을 저장했어요');
    };
    $('#sLink').onclick = () => {
      const link = location.origin + location.pathname + '#s=' + encodeURIComponent(cfg().url);
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
        .then(() => toast('링크를 복사했어요. 카톡으로 보내주세요'))
        .catch(() => prompt('이 링크를 복사해서 보내주세요', link));
    };
    $('#sWipe').onclick = () => wipeSheet(M);
    $('#sOut').onclick = () => { if (confirm('이 폰에서 연결을 끊을까요?')) { ['gb2_cfg', 'gb2_cache', 'gb2_me', 'gb2_sheet'].forEach(LS.del); location.reload(); } };
  });
}
function wipeSheet(m) {
  const groups = [
    { k: 'deposits', label: '통장에 넣은 돈', items: D.deposits.filter(d => d.month === m), op: x => del('deposits', x.id) },
    { k: 'loanPays', label: '대출 납부 체크', hint: '지우면 그만큼 잔금이 다시 늘어나요', items: D.loanPays.filter(x => x.month === m), op: x => del('loanPays', x.key) },
    { k: 'ledger', label: '가계부 기록', items: ledgerOf(m), op: x => del('ledger', x.id) },
    { k: 'incomeMonth', label: '이 달만 바꾼 수입 금액', hint: '평소 금액으로 돌아가요', items: D.incomeMonth.filter(r => r.month === m), op: x => del('incomeMonth', x.key) }
  ];
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  openSheet(`<h2>월별 기록 지우기</h2>
    <div class="wipe-month"><button class="icon-btn" id="wPrev" aria-label="이전 달">‹</button><b>${mLabel(m)}</b><button class="icon-btn" id="wNext" aria-label="다음 달">›</button></div>
    <p class="hint" style="text-align:center;margin-bottom:8px">수입, 통장, 대출 항목은 그대로 두고 이 달에 남긴 기록만 지워요.</p>
    <div class="list">${groups.map(g => `<label class="row wipe-row"><input type="checkbox" data-g="${g.k}" ${g.items.length ? 'checked' : 'disabled'}>
      <span class="mid"><b>${g.label}</b><small>${g.items.length ? `${g.items.length}건${g.hint ? `, ${g.hint}` : ''}` : '기록 없음'}</small></span></label>`).join('')}</div>
    <div class="actions"><button class="btn danger-fill" id="wGo" ${total ? '' : 'disabled'}>${total ? '선택한 기록 지우기' : '지울 기록이 없어요'}</button></div>`, body => {
    $('#wPrev').onclick = () => wipeSheet(shiftMonth(m, -1));
    $('#wNext').onclick = () => wipeSheet(shiftMonth(m, 1));
    $('#wGo').onclick = () => {
      const chosen = groups.filter(g => $(`[data-g="${g.k}"]`, body).checked && g.items.length);
      const ops = chosen.flatMap(g => g.items.map(g.op));
      if (!ops.length) return toast('지울 기록을 골라주세요', true);
      if (!confirm(`${mLabel(m)} 기록 ${ops.length}건을 지울까요?\n(${chosen.map(g => g.label).join(', ')})\n\n앱에서는 되돌릴 수 없어요.`)) return;
      closeSheet(); save(ops, `${mLabel(m)} 기록 ${ops.length}건을 지웠어요`);
    };
  });
}
function pickMe() {
  openSheet(`<h2>이 폰은 누가 쓰나요?</h2>
    <p class="muted" style="margin:0">돈을 넣거나 대출을 체크하면 누가 했는지 함께 남아요. 이름과 이모지는 설정에서 바꿀 수 있어요.</p>
    <div class="actions">${['p1', 'p2'].map(k => { const p = person(k); return `<button class="btn ghost" style="flex:1;flex-direction:column;padding:18px" data-me="${k}"><span style="font-size:40px;line-height:1">${p.emoji}</span>${esc(p.name)}</button>`; }).join('')}</div>`, body => {
    $$('[data-me]', body).forEach(b => b.onclick = () => { LS.set('gb2_me', b.dataset.me); ledgerOwner = null; closeSheet(); render(); });
  });
}

/* ========== 이벤트 ========== */
const ACT = {
  prev() { M = shiftMonth(M, -1); render(); window.scrollTo(0, 0); },
  next() { M = shiftMonth(M, 1); render(); window.scrollTo(0, 0); },
  today() { M = curMonth(); render(); },
  sync() { sync(true); },
  settings: openSettings,
  tab(id) { tab = id; LS.set('gb2_tab', id); render(); window.scrollTo(0, 0); },
  income(id) { incomeSheet(D.incomes.find(i => i.id === id)); },
  addIncome() { incomeSheet(null); },
  env(id) { const e = D.envs.find(x => x.id === id); if (e) envSheet(e); },
  addEnv() { envEditSheet(null); },
  loan(id) { const l = D.loans.find(x => x.id === id); if (l) loanSheet(l); },
  addLoan() { loanSheet(null); },
  payLoan: toggleLoan,
  owner(id) { ledgerOwner = id; render(); },
  led(id) { const x = D.ledger.find(l => l.id === id); if (x) ledgerSheet(x); },
  addLed: addLedger
};
document.addEventListener('click', ev => {
  if (ev.target.closest('[data-close]')) return closeSheet();
  const chip = ev.target.closest('[data-group] [data-v]');
  if (chip) { $$('[data-v]', chip.closest('[data-group]')).forEach(b => b.classList.toggle('on', b === chip)); return; }
  const emo = ev.target.closest('.emo-pick [data-e]');
  if (emo) { const inp = $('#' + emo.closest('.emo-pick').dataset.for); if (inp) inp.value = emo.dataset.e; return; }
  const a = ev.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset.id, a);
});
document.addEventListener('input', ev => {
  if (ev.target.matches('.amt-in input')) { const v = digits(ev.target.value); ev.target.value = v ? fmt(v) : ''; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if (ev.key === 'Enter' && ev.target.matches('#lAmt, #lItem')) addLedger();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && cfg() && Date.now() - lastSync > 30000) sync();
});

/* ========== 시작 ========== */
function start() { $('#setup').hidden = true; $('#app').hidden = false; render(); sync(); }
function showSetup() {
  $('#app').hidden = true; $('#setup').hidden = false;
  const m = location.hash.match(/s=([^&]+)/); if (m) { $('#sUrl').value = decodeURIComponent(m[1]); $('#sPin').focus(); }
}
$('#sGo').onclick = async () => {
  const url = $('#sUrl').value.trim(), pin = $('#sPin').value.trim(), err = $('#sErr'), btn = $('#sGo');
  err.textContent = '';
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { err.textContent = 'Apps Script 웹 앱 주소를 붙여넣어 주세요. /exec로 끝나는 주소예요'; return; }
  if (!pin) { err.textContent = '비밀번호를 적어주세요'; return; }
  btn.disabled = true; btn.textContent = '연결하는 중…';
  try {
    await api('load', {}, { url, pin });
    LS.set('gb2_cfg', { url, pin }); history.replaceState(null, '', location.pathname); start();
  } catch (e) { err.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = '연결하기'; }
};
$('#sPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#sGo').click(); });
if (cfg()) start(); else showSetup();
</script>
</body>
</html>
